# Dependabot configuration for StockPredictorWithSentiment.
# This complements the pip-audit CI job: pip-audit flags known vulnerabilities
# in installed dependencies, while Dependabot opens PRs to keep those
# dependencies (and GitHub Actions) up to date in the first place.
version: 2
updates:
  # Python dependencies (requirements.txt + pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "pip"
    groups:
      # Batch routine bumps into one PR: main's ruleset makes each PR rebase and
      # re-run CI serially, so ungrouped updates cost a full cycle apiece. Major
      # versions still arrive one per PR for individual review.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # 0.x, so its "minor" bumps can change forecast numbers; always its own PR.
          - "statsmodels"

  # GitHub Actions used in CI workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
